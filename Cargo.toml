[package]
name = "hyperQL"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Query language for hyperspatial graph databases with temporal and spatial semantics"
repository = "https://github.com/yourusername/hyperQL"
readme = "README.md"
keywords = ["query-language", "database", "graph", "parser"]
categories = ["database-implementations", "parser-implementations"]
authors = ["Your Name <your.email@example.com>"]

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
colored = "2.0.4"
lazy_static = "1.5.0"
regex = "1.12.2"
serde = { version = "1.0.226", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.16"
tokio = { version = "1.0", features = ["full"] }
winnow = "0.7.13"

[[example]]
name = "knn_demo"
path = "examples/knn_demo.rs"

[[example]]
name = "developer_experience_demo"
path = "examples/developer_experience_demo.rs"
