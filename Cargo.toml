[package]
name = "hyperQL"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
colored = "2.0.4"
lazy_static = "1.5.0"
serde = { version = "1.0.226", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.16"
tokio = { version = "1.0", features = ["full"] }
winnow = "0.7.13"

[[example]]
name = "knn_demo"
path = "examples/knn_demo.rs"
